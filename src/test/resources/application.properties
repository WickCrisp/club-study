# ============================================
# 测试环境配置
# 1) 使用独立测试库 club_system_test，不污染开发库 club_system
# 2) 每次测试上下文启动时用 schema.sql 重建表结构（建表不写数据）
# 3) 关闭 Redis（Cache），测试无需外部 Redis 服务；认证已改为 JWT，不再依赖 Session
# ============================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.cache.type=none
# 测试用固定密钥，保证上下文启动时不依赖环境变量
app.jwt.secret=unit-test-secret-key-at-least-32-bytes-long-2026

# 独立测试库：不存在时自动创建，表结构由 schema.sql 初始化
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/club_system_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# 口令不写进仓库：在项目根目录建 local-test.properties（已被 .gitignore 忽略），内容：
# TEST_DB_PASSWORD=你的MySQL密码
spring.config.import=optional:file:./local-test.properties
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# AI 助手：测试环境不联网，只保证上下文能加载（占位 key，不会发起真实调用）
spring.ai.openai.api-key=test-key-not-used
spring.ai.openai.base-url=http://localhost:9
