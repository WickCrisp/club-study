<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成员管理 - 社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .sidebar {
            min-height: calc(100vh - 56px);
            background: #cfe8ff;
            padding-top: 20px;
        }
        .sidebar .nav-link {
            color: #c9a84c;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover { background: #7a7a7a; }
        .sidebar .nav-link.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #3f3f3f; }
        .sidebar .nav-link i { margin-right: 8px;background-color: #79b828; }
        .content-area { min-height: 600px; padding: 20px; }
        .club-card { border-radius: 10px; transition: transform 0.2s; }
        .club-card:hover { transform: translateY(-2px); }
        .member-table th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .pending-count { font-size: 0.7rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">社团活动管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/club/list">社团管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/member/manage">成员管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/activity/manage">活动管理</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <span id="userNameDisplay"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/user/profile">用户中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                    </ul>
                </li>
                <li class="nav-item" id="loginLink"><a class="nav-link" href="/login">登录</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h6 class="text-muted px-3 mb-3">📋 书页分类</h6>
            <ul class="nav flex-column" id="sidebarTabs">
                <li class="nav-item">
                    <a class="nav-link active" href="#" data-tab="all-clubs">
                        <i class="bi bi-grid-3x3-gap-fill"></i>已有社团目录
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-tab="my-managed">
                        <i class="bi bi-person-badge-fill"></i>我管理的社团
                    </a>
                </li>
            </ul>
        </div>

        <div class="col-md-10 content-area" id="contentArea">
            <div class="text-center text-muted py-5">请先登录...</div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', async function() {
    await initUser();
    if (!currentUser) return;
    setupTabs();
    renderAllClubs();
});

async function initUser() {
    try {
        const resp = await fetch('/api/user/current');
        const result = await resp.json();
        if (result.code === 200 && result.data) {
            currentUser = result.data;
            document.getElementById('userDropdown').style.display = 'block';
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('userNameDisplay').textContent = currentUser.name;
            document.getElementById('contentArea').innerHTML = '';
        }
    } catch (e) {}
}

function setupTabs() {
    const tabs = document.getElementById('sidebarTabs').querySelectorAll('.nav-link');
    tabs.forEach(tab => {
        tab.addEventListener('click', function(e) {
            e.preventDefault();
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const tabName = this.getAttribute('data-tab');
            if (tabName === 'all-clubs') renderAllClubs();
            else if (tabName === 'my-managed') renderMyManaged();
        });
    });
}

async function renderAllClubs() {
    const area = document.getElementById('contentArea');
    area.innerHTML = '<div class="text-center text-muted py-4"><div class="spinner-border"></div><p class="mt-2">加载社团列表...</p></div>';

    const resp = await fetch('/api/club/list');
    const result = await resp.json();
    if (result.code === 200 && result.data && result.data.length > 0) {
        let html = '<h4 class="mb-4"><i class="bi bi-grid-3x3-gap-fill"></i> 已有社团目录</h4><div class="row">';
        result.data.forEach(c => {
            html += '<div class="col-md-4 mb-3"><div class="card club-card h-100"><div class="card-body">';
            html += '<h5 class="card-title">' + c.name + '</h5>';
            html += '<p class="text-muted small">' + (c.description || '暂无简介') + '</p>';
            html += '<p class="text-muted small mb-1">负责人：' + (c.leaderName || '未指定') + '</p>';
            html += '<span class="badge ' + (c.status === 'ACTIVE' ? 'bg-success' : 'bg-secondary') + ' small mb-2">' + (c.status === 'ACTIVE' ? '活跃' : '已解散') + '</span>';
            html += '<div class="mt-2"><button class="btn btn-sm btn-outline-primary" onclick="location.href=\'/club/detail/' + c.id + '\'"><i class="bi bi-eye"></i> 查看详情</button></div>';
            html += '</div></div></div>';
        });
        html += '</div>';
        area.innerHTML = html;
    } else {
        area.innerHTML = '<h4 class="mb-4">已有社团目录</h4><div class="text-center text-muted py-5"><i class="bi bi-inbox" style="font-size:3rem;"></i><p class="mt-2">暂无社团</p></div>';
    }
}

async function renderMyManaged() {
    const area = document.getElementById('contentArea');
    area.innerHTML = '<div class="text-center text-muted py-4"><div class="spinner-border"></div><p class="mt-2">加载我管理的社团...</p></div>';

    const resp = await fetch('/api/club/my-managed');
    const result = await resp.json();
    if (result.code === 200 && result.data && result.data.length > 0) {
        let html = '<h4 class="mb-4"><i class="bi bi-person-badge-fill"></i> 我管理的社团</h4>';
        for (const club of result.data) {
            html += '<div class="card club-card mb-4"><div class="card-header d-flex justify-content-between align-items-center">';
            html += '<span><strong>' + club.name + '</strong> <span class="badge bg-success small">负责人</span></span>';
            html += '<small class="text-muted">' + (club.description || '') + '</small>';
            html += '</div><div class="card-body" id="club-section-' + club.id + '">';
            html += '<div class="text-center text-muted py-2"><div class="spinner-border spinner-border-sm"></div> 加载中...</div>';
            html += '</div></div>';
        }
        html += '</div>';
        area.innerHTML = html;

        for (const club of result.data) {
            await loadClubMembers(club);
        }
    } else {
        area.innerHTML = '<h4 class="mb-4">我管理的社团</h4><div class="text-center text-muted py-5"><i class="bi bi-inbox" style="font-size:3rem;"></i><p class="mt-2">您还不是任何社团的负责人</p></div>';
    }
}

async function loadClubMembers(club) {
    const section = document.getElementById('club-section-' + club.id);
    if (!section) return;

    try {
        const [membersResp, pendingResp] = await Promise.all([
            fetch('/api/club-member/club/' + club.id),
            fetch('/api/club-member/pending/' + club.id)
        ]);
        const membersResult = await membersResp.json();
        const pendingResult = await pendingResp.json();

        let html = '';

        if (pendingResult.code === 200 && pendingResult.data && pendingResult.data.length > 0) {
            html += '<div class="alert alert-warning py-2 mb-3"><strong><i class="bi bi-exclamation-triangle-fill"></i> 待审批申请</strong></div>';
            html += '<table class="table table-sm table-hover"><thead><tr><th>姓名</th><th>学号</th><th>申请理由</th><th>申请时间</th><th>操作</th></tr></thead><tbody>';
            pendingResult.data.forEach(m => {
                html += '<tr><td>' + m.userName + '</td><td>' + m.studentNo + '</td><td>' + (m.applyReason || '无') + '</td><td>' + (m.createdAt ? m.createdAt.substring(0, 16) : '') + '</td><td>';
                html += '<button class="btn btn-sm btn-success me-1" onclick="approveMember(' + m.id + ',' + club.id + ')"><i class="bi bi-check-lg"></i> 通过</button>';
                html += '<button class="btn btn-sm btn-outline-danger" onclick="rejectMember(' + m.id + ',' + club.id + ')"><i class="bi bi-x-lg"></i> 拒绝</button>';
                html += '</td></tr>';
            });
            html += '</tbody></table>';
        }

        html += '<h6 class="mt-3">社团成员</h6>';
        if (membersResult.code === 200 && membersResult.data && membersResult.data.length > 0) {
            html += '<table class="table table-sm table-hover member-table"><thead><tr><th>姓名</th><th>学号</th><th>角色</th><th>状态</th><th>加入时间</th></tr></thead><tbody>';
            membersResult.data.forEach(m => {
                if (m.status === 'APPROVED') {
                    html += '<tr><td>' + m.userName + '</td><td>' + m.studentNo + '</td><td>' + getRoleText(m.role) + '</td><td><span class="badge bg-success">已加入</span></td><td>' + (m.joinedAt ? m.joinedAt.substring(0, 16) : '') + '</td></tr>';
                }
            });
            html += '</tbody></table>';
        } else {
            html += '<div class="text-muted small">暂无已通过成员</div>';
        }

        section.innerHTML = html;
    } catch (e) {
        section.innerHTML = '<div class="text-muted small">加载失败</div>';
    }
}

async function approveMember(memberId, clubId) {
    const resp = await fetch('/api/club-member/approve/' + memberId, { method: 'PUT' });
    const result = await resp.json();
    if (result.code === 200) {
        showToast('已通过申请', 'success');
        const club = { id: clubId };
        await loadClubMembers(club);
    } else {
        showToast(result.message, 'danger');
    }
}

async function rejectMember(memberId, clubId) {
    if (!confirm('确定拒绝该申请吗？')) return;
    const resp = await fetch('/api/club-member/reject/' + memberId, { method: 'PUT' });
    const result = await resp.json();
    if (result.code === 200) {
        showToast('已拒绝申请', 'success');
        const club = { id: clubId };
        await loadClubMembers(club);
    } else {
        showToast(result.message, 'danger');
    }
}

function getRoleText(role) {
    const map = { 'LEADER': '负责人', 'VICE_LEADER': '副负责人', 'MEMBER': '成员' };
    return map[role] || role;
}

function logout() { window.location.href = '/logout'; }

function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'alert alert-' + type + ' alert-dismissible fade show';
    toast.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
