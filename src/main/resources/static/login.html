<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团活动管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h2>社团活动管理系统</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="studentNo" class="form-label">学号</label>
                <input type="text" class="form-control" id="studentNo" placeholder="请输入学号" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
        <div class="text-center mt-3">
            <span>还没有账号？</span><a href="/register">立即注册</a>
        </div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData();
    formData.append('studentNo', document.getElementById('studentNo').value);
    formData.append('password', document.getElementById('password').value);
    try {
        const response = await fetch('/api/user/login', { method: 'POST', body: formData });
        const result = await response.json();
        if (result.code === 200) {
            window.location.href = '/';
        } else {
            showToast(result.message, 'danger');
        }
    } catch (err) {
        showToast('网络错误，请重试', 'danger');
    }
});

function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'alert alert-' + type + ' alert-dismissible fade show';
    toast.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
