<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">社团活动管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/club/list">社团管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/member/manage">成员管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/activity/manage">活动管理</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <span id="userNameDisplay"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/user/profile">用户中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                    </ul>
                </li>
                <li class="nav-item" id="loginLink">
                    <a class="nav-link" href="/login">登录</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>用户中心</h2>
    </div>

    <div class="row">
        <div class="col-md-5">
            <div class="card mb-4">
                <div class="card-header"><h5 class="mb-0">个人信息</h5></div>
                <div class="card-body" id="userInfoCard">
                    <div class="text-center text-muted py-4">加载中...</div>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card mb-4">
                <div class="card-header"><h5 class="mb-0">修改个人信息</h5></div>
                <div class="card-body">
                    <form id="updateForm">
                        <div class="mb-3">
                            <label for="stuNo" class="form-label">学号</label>
                            <input type="text" class="form-control" id="stuNo" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="userName" class="form-label">真实姓名</label>
                            <input type="text" class="form-control" id="userName" required>
                        </div>
                        <div class="mb-3">
                            <label for="userPhone" class="form-label">联系电话</label>
                            <input type="text" class="form-control" id="userPhone">
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">电子邮箱</label>
                            <input type="email" class="form-control" id="userEmail">
                        </div>
                        <div class="mb-3">
                            <label for="userGender" class="form-label">性别</label>
                            <select class="form-control" id="userGender">
                                <option value="0">未知</option>
                                <option value="1">男</option>
                                <option value="2">女</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h5 class="mb-0">修改密码</h5></div>
                <div class="card-body">
                    <form id="passwordForm">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">原密码</label>
                            <input type="password" class="form-control" id="oldPassword" placeholder="请输入原密码" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">新密码</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="请输入新密码" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">确认新密码</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入新密码" required>
                        </div>
                        <button type="submit" class="btn btn-warning">修改密码</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', function() {
    initUser();
});

async function initUser() {
    try {
        const resp = await fetch('/api/user/current');
        const result = await resp.json();
        if (result.code === 200 && result.data) {
            currentUser = result.data;
            document.getElementById('userDropdown').style.display = 'block';
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('userNameDisplay').textContent = currentUser.name;
            renderUserInfo();
            fillForm();
        } else {
            window.location.href = '/login.html';
        }
    } catch (e) {
        window.location.href = '/login.html';
    }
}

function renderUserInfo() {
    const u = currentUser;
    const genderMap = {0: '未知', 1: '男', 2: '女'};
    const roleMap = {STUDENT: '学生', ADMIN: '管理员'};
    const html = `
        <table class="table table-borderless mb-0">
            <tr><td class="text-muted" style="width:100px">学号</td><td><strong>${u.studentNo}</strong> <span class="text-muted" style="font-size:0.85rem;">(ID: ${u.id})</span></td></tr>
            <tr><td class="text-muted">姓名</td><td><strong>${u.name}</strong></td></tr>
            <tr><td class="text-muted">联系电话</td><td>${u.phone || '未填写'}</td></tr>
            <tr><td class="text-muted">电子邮箱</td><td>${u.email || '未填写'}</td></tr>
            <tr><td class="text-muted">性别</td><td>${genderMap[u.gender] || '未知'}</td></tr>
            <tr><td class="text-muted">角色</td><td><span class="badge ${u.role === 'ADMIN' ? 'bg-danger' : 'bg-primary'}">${roleMap[u.role] || u.role}</span></td></tr>
            <tr><td class="text-muted">注册时间</td><td><small>${u.createdAt ? u.createdAt.substring(0, 16) : ''}</small></td></tr>
        </table>`;
    document.getElementById('userInfoCard').innerHTML = html;
}

function fillForm() {
    document.getElementById('stuNo').value = currentUser.studentNo;
    document.getElementById('userName').value = currentUser.name || '';
    document.getElementById('userPhone').value = currentUser.phone || '';
    document.getElementById('userEmail').value = currentUser.email || '';
    document.getElementById('userGender').value = currentUser.gender !== null ? currentUser.gender : 0;
}

document.getElementById('updateForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {
        name: document.getElementById('userName').value,
        phone: document.getElementById('userPhone').value,
        email: document.getElementById('userEmail').value,
        gender: parseInt(document.getElementById('userGender').value)
    };
    try {
        const resp = await fetch('/api/user/update', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await resp.json();
        if (result.code === 200) {
            showToast('信息更新成功', 'success');
            const userResp = await fetch('/api/user/current');
            const userResult = await userResp.json();
            if (userResult.code === 200) {
                currentUser = userResult.data;
                document.getElementById('userNameDisplay').textContent = currentUser.name;
                renderUserInfo();
                fillForm();
            }
        } else {
            showToast(result.message, 'danger');
        }
    } catch (err) {
        showToast('操作失败', 'danger');
    }
});

document.getElementById('passwordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const oldPwd = document.getElementById('oldPassword').value;
    const newPwd = document.getElementById('newPassword').value;
    const confirmPwd = document.getElementById('confirmPassword').value;
    if (newPwd !== confirmPwd) {
        showToast('两次输入的密码不一致', 'danger');
        return;
    }
    const formData = new FormData();
    formData.append('oldPassword', oldPwd);
    formData.append('newPassword', newPwd);
    try {
        const resp = await fetch('/api/user/updatePassword', {
            method: 'PUT',
            body: formData
        });
        const result = await resp.json();
        if (result.code === 200) {
            showToast('密码修改成功', 'success');
            document.getElementById('passwordForm').reset();
        } else {
            showToast(result.message, 'danger');
        }
    } catch (err) {
        showToast('操作失败', 'danger');
    }
});

function logout() { window.location.href = '/logout'; }

function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'alert alert-' + type + ' alert-dismissible fade show';
    toast.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
