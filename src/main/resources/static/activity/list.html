<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动列表 - 社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">社团活动管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/club/list">社团管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/member/manage">成员管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/activity/manage">活动管理</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <span id="userNameDisplay"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/user/profile">用户中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                    </ul>
                </li>
                <li class="nav-item" id="loginLink"><a class="nav-link" href="/login">登录</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>活动列表</h2>
        <div>
            <input type="text" class="form-control search-box d-inline-block me-2" id="searchInput" placeholder="搜索活动...">
            <button class="btn btn-primary" onclick="searchActivity()">搜索</button>
            <button class="btn btn-success ms-2" onclick="window.location.href='/activity/create'">发布活动</button>
        </div>
    </div>

    <div class="row" id="activityList">
        <div class="col-12 text-center text-muted py-4">加载中...</div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', async function() {
    await initUser();
    loadActivities();
});

async function initUser() {
    try {
        const resp = await fetch('/api/user/current');
        const result = await resp.json();
        if (result.code === 200 && result.data) {
            currentUser = result.data;
            document.getElementById('userDropdown').style.display = 'block';
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('userNameDisplay').textContent = result.data.name;
        }
    } catch (e) {}
}

async function loadActivities() {
    try {
        const resp = await fetch('/api/activity/list');
        const result = await resp.json();
        const container = document.getElementById('activityList');
        if (result.code === 200 && result.data && result.data.length > 0) {
            let html = '';
            result.data.forEach(a => {
                html += '<div class="col-md-6 mb-3"><div class="card h-100"><div class="card-body">';
                html += '<h5 class="card-title">' + a.title + '</h5>';
                html += '<p class="text-muted small mb-1">社团：' + (a.clubName || '未知') + ' | 发布人：' + (a.creatorName || '未知') + '</p>';
                html += '<p class="text-muted small mb-1">地点：' + a.location + '</p>';
                html += '<p class="text-muted small mb-1">时间：' + (a.startTime ? a.startTime.substring(0, 16) : '') + ' ~ ' + (a.endTime ? a.endTime.substring(0, 16) : '') + '</p>';
                html += '<p class="text-muted small mb-1">报名：' + a.currentCount + '/' + (a.maxParticipants === 0 ? '不限' : a.maxParticipants) + '</p>';
                html += '<span class="badge status-badge ' + getStatusClass(a.status) + '">' + getStatusText(a.status) + '</span>';
                html += '<div class="mt-2 action-buttons">';
                html += '<button class="btn btn-sm btn-outline-primary" onclick="viewActivity(' + a.id + ')">详情</button>';
                if (a.status === 'PUBLISHED' || a.status === 'ONGOING') {
                    html += '<button class="btn btn-sm btn-outline-success" onclick="registerActivity(' + a.id + ')">报名</button>';
                }
                if (currentUser && (currentUser.id === a.creatorId || currentUser.role === 'ADMIN')) {
                    html += '<button class="btn btn-sm btn-outline-danger" onclick="deleteActivity(' + a.id + ')">删除</button>';
                }
                html += '</div></div></div></div>';
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div class="col-12 text-center text-muted py-4">暂无活动</div>';
        }
    } catch (e) {
        document.getElementById('activityList').innerHTML = '<div class="col-12 text-center text-muted py-4">加载失败</div>';
    }
}

function searchActivity() {
    const keyword = document.getElementById('searchInput').value;
    fetch('/api/activity/search?keyword=' + encodeURIComponent(keyword))
        .then(r => r.json()).then(result => {
            const container = document.getElementById('activityList');
            if (result.code === 200 && result.data && result.data.length > 0) {
                let html = '';
                result.data.forEach(a => {
                    html += '<div class="col-md-6 mb-3"><div class="card h-100"><div class="card-body">';
                    html += '<h5 class="card-title">' + a.title + '</h5>';
                    html += '<p class="text-muted small mb-1">社团：' + (a.clubName || '未知') + '</p>';
                    html += '<p class="text-muted small mb-1">地点：' + a.location + '</p>';
                    html += '<span class="badge status-badge ' + getStatusClass(a.status) + '">' + getStatusText(a.status) + '</span>';
                    html += '<div class="mt-2 action-buttons">';
                    html += '<button class="btn btn-sm btn-outline-primary" onclick="viewActivity(' + a.id + ')">详情</button>';
                    html += '<button class="btn btn-sm btn-outline-success" onclick="registerActivity(' + a.id + ')">报名</button>';
                    html += '</div></div></div></div>';
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="col-12 text-center text-muted py-4">未找到匹配的活动</div>';
            }
        });
}

async function registerActivity(activityId) {
    const formData = new FormData();
    formData.append('activityId', activityId);
    const resp = await fetch('/api/registration/register', { method: 'POST', body: formData });
    const result = await resp.json();
    if (result.code === 200) {
        showToast('报名成功', 'success');
        loadActivities();
    } else {
        showToast(result.message, 'danger');
    }
}

async function deleteActivity(id) {
    if (!confirm('确定要删除该活动吗？')) return;
    const resp = await fetch('/api/activity/' + id, { method: 'DELETE' });
    const result = await resp.json();
    if (result.code === 200) {
        loadActivities();
        showToast('删除成功', 'success');
    } else {
        showToast(result.message, 'danger');
    }
}

function viewActivity(id) { window.location.href = '/activity/detail/' + id; }

function getStatusClass(status) {
    const map = { 'DRAFT': 'bg-secondary', 'PUBLISHED': 'bg-success', 'ONGOING': 'bg-primary', 'FINISHED': 'bg-info', 'CANCELLED': 'bg-danger' };
    return map[status] || 'bg-secondary';
}

function getStatusText(status) {
    const map = { 'DRAFT': '草稿', 'PUBLISHED': '已发布', 'ONGOING': '进行中', 'FINISHED': '已结束', 'CANCELLED': '已取消' };
    return map[status] || status;
}

function logout() { window.location.href = '/logout'; }

function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'alert alert-' + type + ' alert-dismissible fade show';
    toast.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
