<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动详情 - 社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">社团活动管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/club/list">社团管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/member/manage">成员管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/activity/manage">活动管理</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <span id="userNameDisplay"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/user/profile">用户中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                    </ul>
                </li>
                <li class="nav-item" id="loginLink"><a class="nav-link" href="/login">登录</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <a href="/activity/list" class="btn btn-outline-secondary mb-3">← 返回活动列表</a>
        <div class="card">
            <div class="card-body" id="activityInfo">
                <div class="text-center text-muted py-4">加载中...</div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">报名列表</h5>
                    <button class="btn btn-sm btn-light" id="registerBtn" onclick="registerActivity()">立即报名</button>
                </div>
                <div class="card-body" id="registrationList">
                    <div class="text-center text-muted py-3">加载中...</div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><h5 class="mb-0">签到记录</h5></div>
                <div class="card-body" id="checkinList">
                    <div class="text-center text-muted py-3">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">活动总结</h5>
                    <button class="btn btn-sm btn-light" onclick="showSummaryModal()">添加总结</button>
                </div>
                <div class="card-body" id="summaryContent">
                    <div class="text-center text-muted py-3">暂无总结</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="summaryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">活动总结</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="summaryForm">
                    <div class="mb-3">
                        <label for="summaryContentInput" class="form-label">活动内容总结</label>
                        <textarea class="form-control" id="summaryContentInput" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="summaryEffect" class="form-label">活动效果评估</label>
                        <textarea class="form-control" id="summaryEffect" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="summarySuggestions" class="form-label">改进建议</label>
                        <textarea class="form-control" id="summarySuggestions" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveSummary()">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const activityId = window.location.pathname.split('/').pop();
let summaryModal;
let currentUser = null;
let activityData = null;

document.addEventListener('DOMContentLoaded', async function() {
    summaryModal = new bootstrap.Modal(document.getElementById('summaryModal'));
    await initUser();
    loadActivityInfo();
    loadRegistrations();
    loadCheckins();
    loadSummary();
});

async function initUser() {
    try {
        const resp = await fetch('/api/user/current');
        const result = await resp.json();
        if (result.code === 200 && result.data) {
            currentUser = result.data;
            document.getElementById('userDropdown').style.display = 'block';
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('userNameDisplay').textContent = result.data.name;
        }
    } catch (e) {}
}

async function loadActivityInfo() {
    const resp = await fetch('/api/activity/' + activityId);
    const result = await resp.json();
    if (result.code === 200) {
        const a = result.data;
        activityData = a;
        let deleteBtn = '';
        if (currentUser && (currentUser.id === a.creatorId || currentUser.role === 'ADMIN')) {
            deleteBtn = '<button class="btn btn-danger btn-sm ms-3" onclick="deleteActivity()">删除活动</button>';
        }
        document.getElementById('activityInfo').innerHTML =
            '<div class="d-flex justify-content-between align-items-start"><h3>' + a.title + '</h3>' + deleteBtn + '</div>' +
            '<p class="text-muted">' + (a.description || '暂无简介') + '</p>' +
            '<p>社团：' + (a.clubName || '未知') + ' | 发布人：' + (a.creatorName || '未知') + '</p>' +
            '<p>地点：' + a.location + '</p>' +
            '<p>时间：' + (a.startTime ? a.startTime.substring(0, 16) : '') + ' ~ ' + (a.endTime ? a.endTime.substring(0, 16) : '') + '</p>' +
            '<p>报名人数：' + a.currentCount + '/' + (a.maxParticipants === 0 ? '不限' : a.maxParticipants) + '</p>' +
            '<span class="badge status-badge ' + getStatusClass(a.status) + '">' + getStatusText(a.status) + '</span>';
    }
}

async function loadRegistrations() {
    const resp = await fetch('/api/registration/activity/' + activityId);
    const result = await resp.json();
    const container = document.getElementById('registrationList');
    if (result.code === 200 && result.data && result.data.length > 0) {
        let html = '<table class="table table-hover"><thead><tr><th>姓名</th><th>学号</th><th>报名时间</th><th>状态</th></tr></thead><tbody>';
        result.data.forEach(r => {
            html += '<tr><td>' + r.userName + '</td><td>' + r.studentNo + '</td><td>' + (r.registeredAt ? r.registeredAt.substring(0, 16) : '') + '</td><td>' + (r.status === 'REGISTERED' ? '<span class="badge bg-success">已报名</span>' : '<span class="badge bg-danger">已取消</span>') + '</td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } else {
        container.innerHTML = '<div class="text-center text-muted py-3">暂无报名</div>';
    }
}

async function loadCheckins() {
    const resp = await fetch('/api/checkin/activity/' + activityId);
    const result = await resp.json();
    const container = document.getElementById('checkinList');
    if (result.code === 200 && result.data && result.data.length > 0) {
        let html = '<table class="table table-hover"><thead><tr><th>姓名</th><th>签到</th><th>签退</th><th>操作</th></tr></thead><tbody>';
        result.data.forEach(c => {
            html += '<tr><td>' + c.userName + '</td><td>' + getCheckStatusBadge(c.checkinStatus) + (c.checkinTime ? '<br><small>' + c.checkinTime.substring(0, 16) + '</small>' : '') + '</td><td>' + getCheckStatusBadge(c.checkoutStatus) + (c.checkoutTime ? '<br><small>' + c.checkoutTime.substring(0, 16) + '</small>' : '') + '</td><td>';
            if (c.checkinStatus === 'UNCHECKED') html += '<button class="btn btn-sm btn-outline-success me-1" onclick="doCheckin(' + c.id + ')">签到</button>';
            if (c.checkinStatus === 'CHECKED' && c.checkoutStatus === 'UNCHECKED') html += '<button class="btn btn-sm btn-outline-warning" onclick="doCheckout(' + c.id + ')">签退</button>';
            html += '</td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } else {
        container.innerHTML = '<div class="text-center text-muted py-3">暂无签到记录</div>';
    }
}

async function loadSummary() {
    const resp = await fetch('/api/summary/activity/' + activityId);
    const result = await resp.json();
    const container = document.getElementById('summaryContent');
    if (result.code === 200 && result.data) {
        const s = result.data;
        container.innerHTML = '<h6>活动内容</h6><p>' + (s.content || '无') + '</p>' +
            '<h6>效果评估</h6><p>' + (s.effect || '无') + '</p>' +
            '<h6>改进建议</h6><p>' + (s.suggestions || '无') + '</p>' +
            '<small class="text-muted">创建人：' + (s.creatorName || '未知') + ' | 时间：' + (s.createdAt ? s.createdAt.substring(0, 16) : '') + '</small>';
    } else {
        container.innerHTML = '<div class="text-center text-muted py-3">暂无总结</div>';
    }
}

async function registerActivity() {
    const formData = new FormData();
    formData.append('activityId', activityId);
    const resp = await fetch('/api/registration/register', { method: 'POST', body: formData });
    const result = await resp.json();
    if (result.code === 200) {
        showToast('报名成功', 'success');
        loadActivityInfo();
        loadRegistrations();
        loadCheckins();
    } else {
        showToast(result.message, 'danger');
    }
}

async function doCheckin(id) {
    const resp = await fetch('/api/checkin/checkin/' + id, { method: 'PUT' });
    const result = await resp.json();
    if (result.code === 200) {
        showToast('签到成功', 'success');
        loadCheckins();
    } else {
        showToast(result.message, 'danger');
    }
}

async function doCheckout(id) {
    const resp = await fetch('/api/checkin/checkout/' + id, { method: 'PUT' });
    const result = await resp.json();
    if (result.code === 200) {
        showToast('签退成功', 'success');
        loadCheckins();
    } else {
        showToast(result.message, 'danger');
    }
}

function showSummaryModal() {
    document.getElementById('summaryContentInput').value = '';
    document.getElementById('summaryEffect').value = '';
    document.getElementById('summarySuggestions').value = '';
    summaryModal.show();
}

async function saveSummary() {
    const data = {
        activityId: parseInt(activityId),
        content: document.getElementById('summaryContentInput').value,
        effect: document.getElementById('summaryEffect').value,
        suggestions: document.getElementById('summarySuggestions').value
    };
    const resp = await fetch('/api/summary/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.code === 200) {
        summaryModal.hide();
        loadSummary();
        showToast('保存成功', 'success');
    } else {
        showToast(result.message, 'danger');
    }
}

function getStatusClass(status) {
    const map = { 'DRAFT': 'bg-secondary', 'PUBLISHED': 'bg-success', 'ONGOING': 'bg-primary', 'FINISHED': 'bg-info', 'CANCELLED': 'bg-danger' };
    return map[status] || 'bg-secondary';
}

function getStatusText(status) {
    const map = { 'DRAFT': '草稿', 'PUBLISHED': '已发布', 'ONGOING': '进行中', 'FINISHED': '已结束', 'CANCELLED': '已取消' };
    return map[status] || status;
}

function getCheckStatusBadge(status) {
    return status === 'CHECKED' ? '<span class="badge bg-success">已完成</span>' : '<span class="badge bg-warning">未完成</span>';
}

function logout() { window.location.href = '/logout'; }

async function deleteActivity() {
    if (!confirm('确定要删除该活动吗？删除后无法恢复。')) return;
    try {
        const resp = await fetch('/api/activity/' + activityId, { method: 'DELETE' });
        const result = await resp.json();
        if (result.code === 200) {
            showToast('活动已删除', 'success');
            setTimeout(() => window.location.href = '/activity/list', 1500);
        } else {
            showToast(result.message, 'danger');
        }
    } catch (e) {
        showToast('删除失败', 'danger');
    }
}

function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'alert alert-' + type + ' alert-dismissible fade show';
    toast.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
