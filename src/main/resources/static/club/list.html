<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团列表 - 社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">社团活动管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link active" href="/club/list">社团管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/member/manage">成员管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/activity/manage">活动管理</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <span id="userNameDisplay"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/user/profile">用户中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                    </ul>
                </li>
                <li class="nav-item" id="loginLink"><a class="nav-link" href="/login">登录</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>社团列表</h2>
        <div>
            <input type="text" class="form-control search-box d-inline-block me-2" id="searchInput" placeholder="搜索社团...">
            <button class="btn btn-primary" onclick="searchClub()">搜索</button>
            <button class="btn btn-success ms-2" onclick="showCreateModal()">创建社团</button>
        </div>
    </div>

    <div class="row" id="clubList">
        <div class="col-12 text-center text-muted py-4">加载中...</div>
    </div>
</div>

<div class="modal fade" id="clubModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">创建社团</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="clubForm">
                    <input type="hidden" id="clubId">
                    <div class="mb-3">
                        <label for="clubName" class="form-label">社团名称</label>
                        <input type="text" class="form-control" id="clubName" required>
                    </div>
                    <div class="mb-3">
                        <label for="clubDesc" class="form-label">社团简介</label>
                        <textarea class="form-control" id="clubDesc" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="clubLeader" class="form-label">负责人ID</label>
                        <input type="number" class="form-control" id="clubLeader">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveClub()">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let clubModal;
document.addEventListener('DOMContentLoaded', function() {
    clubModal = new bootstrap.Modal(document.getElementById('clubModal'));
    initUser();
    loadClubs();
});

async function initUser() {
    try {
        const resp = await fetch('/api/user/current');
        const result = await resp.json();
        if (result.code === 200 && result.data) {
            document.getElementById('userDropdown').style.display = 'block';
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('userNameDisplay').textContent = result.data.name;
        }
    } catch (e) {}
}

async function loadClubs() {
    try {
        const resp = await fetch('/api/club/list');
        const result = await resp.json();
        const container = document.getElementById('clubList');
        if (result.code === 200 && result.data && result.data.length > 0) {
            let html = '';
            result.data.forEach(c => {
                html += '<div class="col-md-4 mb-3"><div class="card h-100"><div class="card-body">';
                html += '<h5 class="card-title">' + c.name + '</h5>';
                html += '<p class="text-muted small">' + (c.description || '暂无简介') + '</p>';
                html += '<p class="text-muted small">负责人：' + (c.leaderName || '未指定') + '</p>';
                html += '<span class="badge ' + (c.status === 'ACTIVE' ? 'bg-success' : 'bg-secondary') + ' status-badge">' + (c.status === 'ACTIVE' ? '活跃' : '已解散') + '</span>';
                html += '<div class="mt-2 action-buttons">';
                html += '<button class="btn btn-sm btn-outline-primary" onclick="viewClub(' + c.id + ')">详情</button>';
                html += '<button class="btn btn-sm btn-outline-warning" onclick="editClub(' + c.id + ')">编辑</button>';
                html += '<button class="btn btn-sm btn-outline-danger" onclick="deleteClub(' + c.id + ')">删除</button>';
                html += '</div></div></div></div>';
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div class="col-12 text-center text-muted py-4">暂无社团</div>';
        }
    } catch (e) {
        document.getElementById('clubList').innerHTML = '<div class="col-12 text-center text-muted py-4">加载失败</div>';
    }
}

function searchClub() {
    const keyword = document.getElementById('searchInput').value;
    fetch('/api/club/search?keyword=' + encodeURIComponent(keyword))
        .then(r => r.json()).then(result => {
            const container = document.getElementById('clubList');
            if (result.code === 200 && result.data && result.data.length > 0) {
                let html = '';
                result.data.forEach(c => {
                    html += '<div class="col-md-4 mb-3"><div class="card h-100"><div class="card-body">';
                    html += '<h5 class="card-title">' + c.name + '</h5>';
                    html += '<p class="text-muted small">' + (c.description || '暂无简介') + '</p>';
                    html += '<p class="text-muted small">负责人：' + (c.leaderName || '未指定') + '</p>';
                    html += '<div class="mt-2 action-buttons">';
                    html += '<button class="btn btn-sm btn-outline-primary" onclick="viewClub(' + c.id + ')">详情</button>';
                    html += '<button class="btn btn-sm btn-outline-warning" onclick="editClub(' + c.id + ')">编辑</button>';
                    html += '<button class="btn btn-sm btn-outline-danger" onclick="deleteClub(' + c.id + ')">删除</button>';
                    html += '</div></div></div></div>';
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="col-12 text-center text-muted py-4">未找到匹配的社团</div>';
            }
        });
}

function showCreateModal() {
    document.getElementById('modalTitle').textContent = '创建社团';
    document.getElementById('clubId').value = '';
    document.getElementById('clubName').value = '';
    document.getElementById('clubDesc').value = '';
    document.getElementById('clubLeader').value = '';
    clubModal.show();
}

async function editClub(id) {
    const resp = await fetch('/api/club/' + id);
    const result = await resp.json();
    if (result.code === 200) {
        document.getElementById('modalTitle').textContent = '编辑社团';
        document.getElementById('clubId').value = result.data.id;
        document.getElementById('clubName').value = result.data.name;
        document.getElementById('clubDesc').value = result.data.description || '';
        document.getElementById('clubLeader').value = result.data.leaderId || '';
        clubModal.show();
    }
}

async function saveClub() {
    const id = document.getElementById('clubId').value;
    const data = {
        name: document.getElementById('clubName').value,
        description: document.getElementById('clubDesc').value,
        leaderId: document.getElementById('clubLeader').value ? parseInt(document.getElementById('clubLeader').value) : null
    };
    const url = id ? '/api/club/update' : '/api/club/create';
    const method = id ? 'PUT' : 'POST';
    if (id) data.id = parseInt(id);
    try {
        const resp = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await resp.json();
        if (result.code === 200) {
            clubModal.hide();
            loadClubs();
            showToast('操作成功', 'success');
        } else {
            showToast(result.message, 'danger');
        }
    } catch (e) {
        showToast('操作失败', 'danger');
    }
}

async function deleteClub(id) {
    if (!confirm('确定要删除该社团吗？')) return;
    const resp = await fetch('/api/club/' + id, { method: 'DELETE' });
    const result = await resp.json();
    if (result.code === 200) {
        loadClubs();
        showToast('删除成功', 'success');
    } else {
        showToast(result.message, 'danger');
    }
}

function viewClub(id) {
    window.location.href = '/club/detail/' + id;
}

function logout() { window.location.href = '/logout'; }

function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'alert alert-' + type + ' alert-dismissible fade show';
    toast.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
