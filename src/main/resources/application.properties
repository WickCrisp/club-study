spring.application.name=club-system
server.port=${SERVER_PORT:8081}

# ==================== 数据源 ====================
# 账号口令一律来自环境变量（生产）或 application-dev.properties（本地），此文件不放任何默认值
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

mybatis.configuration.map-underscore-to-camel-case=true

# ==================== Redis ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# ==================== 认证（JWT，无状态） ====================
# 没有默认值：未配置 JWT_SECRET 时启动直接失败，避免悄悄使用公开的默认密钥
app.jwt.secret=${JWT_SECRET}
app.jwt.expire-minutes=${JWT_EXPIRE_MINUTES:120}

# ==================== 跨域 ====================
# 留空 = 只允许同源（生产用 Nginx 同域反代，本来就不需要 CORS）
# 需要跨域时在环境变量里填：CORS_ORIGINS=https://a.com,https://b.com
app.cors.origins=${CORS_ORIGINS:}

# ==================== AI 助手（Spring AI + DeepSeek） ====================
# DeepSeek 走 OpenAI 兼容协议；base-url 只写到域名，客户端自动拼 /v1/chat/completions
spring.ai.openai.base-url=https://api.deepseek.com
# 密钥只从环境变量读取，未配置时用占位符保证应用能启动（调用时返回友好提示）
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:sk-no-key-configured}
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=800
