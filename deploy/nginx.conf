server_tokens off;

# 学生端门户 + 管理端 + API 反代，单域名部署
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全响应头（后端 SecurityHeadersFilter 会带四个，这里统一再压一层并补 CSP）
    # style-src 的 unsafe-inline 是 Element Plus 必需的（组件大量写内联 style）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # 学生端（门户）
    root /usr/share/nginx/html/portal;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端（/admin/ 子路径，构建时由 admin/.env.production 决定）
    # 不带斜杠的 /admin 会落进下面的 / 兜底、被门户路由重定向到 /login，这里补一个 301
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # API 反代到后端容器（服务名 app，仅 compose 内网可达）
    location /api/ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 助手是 SSE 流式响应（POST /api/assistant/chat）：
        # 不关缓冲的话，Nginx 会把整段答案攒齐才发给浏览器，"逐字吐字"就没了
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ============================================================
