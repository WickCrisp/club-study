name: club-system

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: club_system
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据目录为空）自动建表 + 注入引导管理员
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 刻意不发布 3306：数据库只在 compose 内网可达，公网摸不到

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 刻意不发布 6379：同上

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: club-system-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器网络内固定指向服务名（覆盖 .env 里面向本地的同名值）
      DB_URL: jdbc:mysql://mysql:3306/club_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8081"
      # 容器默认 UTC，不指定时区的话活动时间会偏 8 小时
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/api/club/list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    # 8081 不对外发布：只有 nginx 能访问后端

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 启用 HTTPS 后放开：
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端产物直接挂载目录，更新前端只需重新上传 dist，无需重建镜像
      - ../frontend/dist:/usr/share/nginx/html/portal:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
      # 启用 TLS 后放开：
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  mysql-data:
